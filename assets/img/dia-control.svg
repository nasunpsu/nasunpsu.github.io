<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 132" role="img" aria-label="Describing an edit loops through prompt, generate and check; pointing at an edit goes select then edit, done.">
  <defs>
    <marker id="c-ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2c5f4f"/>
    </marker>
    <style>
      .lbl{font:600 9px "Helvetica Neue",Arial,sans-serif;fill:#6b6b6b;letter-spacing:.08em}
      .nd{font:500 10px "Helvetica Neue",Arial,sans-serif;fill:#1e1e1e}
      .ln{stroke:#2c5f4f;stroke-width:1.3;fill:none;marker-end:url(#c-ar)}
      .bx{fill:#fff;stroke:#cfdbd5;stroke-width:1;rx:5}
    </style>
  </defs>

  <text class="lbl" x="14" y="17">DESCRIBE IT</text>
  <rect class="bx" x="14" y="28" width="58" height="24" rx="5"/>
  <text class="nd" x="43" y="44" text-anchor="middle">prompt</text>
  <rect class="bx" x="90" y="28" width="62" height="24" rx="5"/>
  <text class="nd" x="121" y="44" text-anchor="middle">generate</text>
  <rect class="bx" x="90" y="72" width="62" height="24" rx="5"/>
  <text class="nd" x="121" y="88" text-anchor="middle">check</text>
  <path class="ln" d="M74 40 H86"/>
  <path class="ln" d="M121 54 V68"/>
  <path class="ln" d="M88 84 H48 V56"/>
  <text class="nd" x="26" y="112" fill="#6b6b6b" font-size="9">try again</text>

  <line x1="200" y1="16" x2="200" y2="116" stroke="#e6e3dd" stroke-width="1"/>

  <text class="lbl" x="228" y="17">POINT AT IT</text>
  <rect class="bx" x="228" y="46" width="58" height="24" rx="5"/>
  <text class="nd" x="257" y="62" text-anchor="middle">select</text>
  <rect class="bx" x="304" y="46" width="52" height="24" rx="5"/>
  <text class="nd" x="330" y="62" text-anchor="middle">edit</text>
  <path class="ln" d="M288 58 H300"/>
  <circle cx="372" cy="58" r="9" fill="#e8efec"/>
  <path d="M368 58 l3 3 l5 -6" stroke="#2c5f4f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text class="nd" x="228" y="88" fill="#6b6b6b" font-size="9">what people reached for</text>
</svg>
