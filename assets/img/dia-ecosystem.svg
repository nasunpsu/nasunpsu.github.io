<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 132" role="img" aria-label="A three-sided platform: end users want apps that work, IT admins carry the risk, and third-party developers can build somewhere else. Each pair is in tension.">
  <defs>
    <style>
      .n{font:600 10px "Helvetica Neue",Arial,sans-serif;fill:#1e1e1e}
      .d{font:400 8.5px "Helvetica Neue",Arial,sans-serif;fill:#6b6b6b}
      .t{font:400 8px "Helvetica Neue",Arial,sans-serif;fill:#2c5f4f}
      .edge{stroke:#cfdbd5;stroke-width:1.2}
    </style>
  </defs>

  <line class="edge" x1="200" y1="30" x2="92" y2="88"/>
  <line class="edge" x1="200" y1="30" x2="308" y2="88"/>
  <line class="edge" x1="92" y1="88" x2="308" y2="88"/>

  <circle cx="200" cy="30" r="12" fill="#e8efec" stroke="#2c5f4f" stroke-width="1.3"/>
  <circle cx="92" cy="88" r="12" fill="#e8efec" stroke="#2c5f4f" stroke-width="1.3"/>
  <circle cx="308" cy="88" r="12" fill="#2c5f4f"/>

  <text class="n" x="200" y="15" text-anchor="middle">End users</text>
  <text class="d" x="200" y="55" text-anchor="middle">want it to just work</text>

  <text class="n" x="92" y="113" text-anchor="middle">IT admins</text>
  <text class="d" x="92" y="124" text-anchor="middle">carry the risk</text>

  <text class="n" x="308" y="113" text-anchor="middle">Developers</text>
  <text class="d" x="308" y="124" text-anchor="middle">can build elsewhere</text>

  <text class="t" x="128" y="58" text-anchor="middle">governance</text>
  <text class="t" x="272" y="58" text-anchor="middle">reach</text>
  <text class="t" x="200" y="84" text-anchor="middle">what's allowed to run</text>
</svg>
