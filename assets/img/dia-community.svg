<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 132" role="img" aria-label="Build an instrument, build a system, then measure: collective efficacy moved and sense of community did not.">
  <defs>
    <marker id="m-ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2c5f4f"/>
    </marker>
    <style>
      .st{font:500 9.5px "Helvetica Neue",Arial,sans-serif;fill:#1e1e1e}
      .cp{font:400 8.5px "Helvetica Neue",Arial,sans-serif;fill:#6b6b6b}
      .up{font:600 9px "Helvetica Neue",Arial,sans-serif;fill:#2c5f4f}
      .fl{font:600 9px "Helvetica Neue",Arial,sans-serif;fill:#9a9a9a}
      .ln{stroke:#2c5f4f;stroke-width:1.3;fill:none;marker-end:url(#m-ar)}
      .bx{fill:#fff;stroke:#cfdbd5;stroke-width:1}
    </style>
  </defs>

  <rect class="bx" x="12" y="24" width="72" height="30" rx="5"/>
  <text class="st" x="48" y="38" text-anchor="middle">instrument</text>
  <text class="cp" x="48" y="49" text-anchor="middle">n = 740</text>

  <rect class="bx" x="100" y="24" width="72" height="30" rx="5"/>
  <text class="st" x="136" y="38" text-anchor="middle">system</text>
  <text class="cp" x="136" y="49" text-anchor="middle">bot + web app</text>

  <rect class="bx" x="188" y="24" width="72" height="30" rx="5"/>
  <text class="st" x="224" y="38" text-anchor="middle">experiment</text>
  <text class="cp" x="224" y="49" text-anchor="middle">n = 121</text>

  <path class="ln" d="M86 39 H96"/>
  <path class="ln" d="M174 39 H184"/>
  <path class="ln" d="M262 39 H284"/>

  <rect x="290" y="16" width="98" height="22" rx="4" fill="#e8efec"/>
  <text class="up" x="298" y="31">↑ coordination</text>
  <rect x="290" y="42" width="98" height="22" rx="4" fill="#f2f2f0"/>
  <text class="fl" x="298" y="57">— belonging</text>

  <text class="cp" x="12" y="86">The benefit landed with people who rated themselves</text>
  <text class="cp" x="12" y="99"><tspan fill="#2c5f4f" font-weight="600">least</tspan> fluent with the tool — not the power users.</text>
</svg>
